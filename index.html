<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="在浏览器中将两张图片拼接为一张高清 JPG。"
    />
    <title>双图拼接画布</title>
    <link rel="stylesheet" href="./styles.css?v=5" />
  </head>
  <body>
    <main class="app-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">DUAL FRAME</p>
          <h1>双图拼接画布</h1>
          <p class="subtitle">两张图片，一张画布。所有处理都只在你的设备上完成。</p>
        </div>
        <button class="button button-primary header-export" id="export-button" type="button">
          <span aria-hidden="true">↓</span>
          导出高清 JPG
        </button>
      </header>

      <section class="workspace" aria-label="双图编辑器">
        <div class="canvas-column">
          <div class="stage-shell">
            <div id="stage">
              <canvas
                id="render-canvas"
                width="655"
                height="648"
                aria-label="655 × 648 双图画布"
              ></canvas>
              <button class="drop-zone" id="left-drop-zone" type="button">
                <span class="upload-icon" aria-hidden="true">＋</span>
                <strong>添加左侧图片</strong>
                <small>点击或拖放图片</small>
              </button>
              <button class="drop-zone" id="right-drop-zone" type="button">
                <span class="upload-icon" aria-hidden="true">＋</span>
                <strong>添加右侧图片</strong>
                <small>点击或拖放图片</small>
              </button>
            </div>
          </div>
          <div class="canvas-meta">
            <span><i class="status-dot"></i>655 × 648 px</span>
            <span>高清 JPG · 2×</span>
          </div>
        </div>

        <aside class="controls" aria-label="编辑控制">
          <div class="panel-heading">
            <div>
              <p class="panel-kicker">编辑图片</p>
              <h2 id="selection-title">左侧图片</h2>
            </div>
            <div class="segment" aria-label="选择图片">
              <button class="segment-button is-active" data-side="0" type="button">左</button>
              <button class="segment-button" data-side="1" type="button">右</button>
            </div>
          </div>

          <div class="upload-actions">
            <button class="button button-secondary" data-replace="0" type="button">
              选择左图
            </button>
            <button class="button button-secondary" data-replace="1" type="button">
              选择右图
            </button>
          </div>

          <div class="control-group">
            <label for="gap">
              <span>图片间距</span>
              <output id="gap-value" for="gap">10px</output>
            </label>
            <input id="gap" type="range" min="0" max="40" value="10" />
          </div>

          <div class="divider"></div>

          <div class="control-group">
            <label for="scale">
              <span>缩放</span>
              <output id="scale-value" for="scale">100%</output>
            </label>
            <input id="scale" type="range" min="100" max="600" value="100" />
          </div>

          <div class="control-group">
            <label for="offset-x">
              <span>左右</span>
              <output id="offset-x-value" for="offset-x">0</output>
            </label>
            <input id="offset-x" type="range" min="-100" max="100" value="0" />
          </div>

          <div class="control-group">
            <label for="offset-y">
              <span>上下</span>
              <output id="offset-y-value" for="offset-y">0</output>
            </label>
            <input id="offset-y" type="range" min="-100" max="100" value="0" />
          </div>

          <div class="action-grid">
            <button class="button button-secondary" id="swap-button" type="button">
              ⇄&nbsp; 交换左右
            </button>
            <button class="button button-secondary" id="reset-button" type="button">
              ↻&nbsp; 重置
            </button>
          </div>

          <p class="tip">拖动图片调整位置，滚轮或双指可缩放。</p>
          <p id="status" class="status-message" role="status" aria-live="polite"></p>
        </aside>
      </section>

      <input id="left-file" type="file" accept="image/*" hidden />
      <input id="right-file" type="file" accept="image/*" hidden />
      <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    </main>

    <script type="module" src="./app.js?v=5"></script>
  </body>
</html>
