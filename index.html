<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="双图拼接画布 + 图片大小调节，所有处理只在你的设备上完成。" />
    <title>DUAL FRAME · 双图工具</title>
    <link rel="stylesheet" href="./styles.css?v=10" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="tab-bar" aria-label="工具切换" style="display:flex;justify-content:center;margin:0 auto 16px;">
        <button class="tab active" data-tab="dual" type="button">DUAL FRAME</button>
        <button class="tab" data-tab="resizer" type="button">PIXEL SCALE</button>
      </nav>

      <!-- ========== DUAL FRAME ========== -->
      <section id="tab-dual" class="tab-content active">
        <header class="hero">
          <div>
            <p class="eyebrow">DUAL FRAME</p>
            <h1>双图拼接画布</h1>
            <p class="subtitle">两张图片，一张画布。所有处理都只在你的设备上完成。</p>
          </div>
          <button class="button button-primary header-export" id="export-button" type="button">
            <span aria-hidden="true">↓</span>
            导出无损 PNG
          </button>
        </header>

        <section class="workspace" aria-label="双图编辑器">
          <div class="canvas-column">
            <div class="stage-shell">
              <div id="stage">
                <canvas id="render-canvas" width="655" height="648" aria-label="可调宽度双图画布"></canvas>
                <button class="drop-zone" id="left-drop-zone" type="button">
                  <span class="upload-icon" aria-hidden="true">＋</span>
                  <strong>添加左侧图片</strong>
                  <small>点击或拖放图片</small>
                </button>
                <button class="drop-zone" id="right-drop-zone" type="button">
                  <span class="upload-icon" aria-hidden="true">＋</span>
                  <strong>添加右侧图片</strong>
                  <small>点击或拖放图片</small>
                </button>
              </div>
            </div>
            <div class="canvas-meta">
              <span id="canvas-size-label"><i class="status-dot"></i>655 × 648 px</span>
              <span>无损 PNG · 4×</span>
            </div>
          </div>

          <aside class="controls" aria-label="编辑控制">
            <div class="panel-heading">
              <div>
                <p class="panel-kicker">编辑图片</p>
                <h2 id="selection-title">左侧图片</h2>
              </div>
              <div class="segment" aria-label="选择图片">
                <button class="segment-button is-active" data-side="0" type="button">左</button>
                <button class="segment-button" data-side="1" type="button">右</button>
              </div>
            </div>

            <div class="upload-actions">
              <button class="button button-secondary" data-replace="0" type="button">选择左图</button>
              <button class="button button-secondary" data-replace="1" type="button">选择右图</button>
            </div>

            <div class="control-group">
              <label for="canvas-width">
                <span>画布宽度</span>
                <output id="canvas-width-value" for="canvas-width">655px</output>
              </label>
              <input id="canvas-width" type="range" min="655" max="1055" value="655" />
            </div>

            <div class="control-group">
              <label for="gap">
                <span>图片间距</span>
                <output id="gap-value" for="gap">10px</output>
              </label>
              <input id="gap" type="range" min="0" max="40" value="10" />
            </div>

            <div class="divider"></div>

            <div class="control-group">
              <label for="scale">
                <span>缩放</span>
                <output id="scale-value" for="scale">100%</output>
              </label>
              <input id="scale" type="range" min="100" max="600" value="100" />
            </div>

            <div class="control-group">
              <label for="offset-x">
                <span>左右</span>
                <output id="offset-x-value" for="offset-x">0</output>
              </label>
              <input id="offset-x" type="range" min="-100" max="100" value="0" />
            </div>

            <div class="control-group">
              <label for="offset-y">
                <span>上下</span>
                <output id="offset-y-value" for="offset-y">0</output>
              </label>
              <input id="offset-y" type="range" min="-100" max="100" value="0" />
            </div>

            <div class="action-grid">
              <button class="button button-secondary" id="swap-button" type="button">⇄&nbsp; 交换左右</button>
              <button class="button button-secondary" id="reset-button" type="button">↻&nbsp; 重置</button>
            </div>

            <p class="tip">拖动图片调整位置，滚轮或双指可缩放。</p>
            <p id="status" class="status-message" role="status" aria-live="polite"></p>
          </aside>
        </section>

        <input id="left-file" type="file" accept="image/*" multiple hidden />
        <input id="right-file" type="file" accept="image/*" multiple hidden />
        <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
      </section>

      <!-- ========== PIXEL SCALE ========== -->
      <section id="tab-resizer" class="tab-content">
        <header class="hero">
          <div>
            <p class="eyebrow">PIXEL SCALE</p>
            <h1>图片大小调节</h1>
            <p class="subtitle">上传图片 · 无损尺寸 · 格式与质量调节文件大小</p>
          </div>
        </header>

        <div style="max-width:480px;margin:0 auto;padding:0 0 40px;">
          <div class="rz-upload-zone" id="rz-upload-zone">
            <div class="rz-upload-icon">⬆</div>
            <div class="rz-upload-label">点击或拖入图片</div>
            <div class="rz-upload-hint">支持 JPG · PNG · WebP · HEIC</div>
          </div>
          <input type="file" id="rz-file-input" accept="image/*" />

          <div class="rz-preview-area" id="rz-preview-area">
            <img id="rz-preview-img" alt="预览" />
          </div>

          <div class="rz-info-row" id="rz-info-row">
            <div class="rz-info-chip">
              <div class="rz-label">原始大小</div>
              <div class="rz-value" id="rz-original-size">—</div>
            </div>
            <div class="rz-info-chip">
              <div class="rz-label">原始尺寸</div>
              <div class="rz-value" id="rz-original-dims">—</div>
            </div>
          </div>

          <div class="rz-controls-card" style="display:none" id="rz-controls-card">
            <div class="rz-card-header">输出格式</div>
            <div class="rz-format-tabs">
              <div class="rz-format-tab rz-active" data-format="image/jpeg">JPEG</div>
              <div class="rz-format-tab" data-format="image/webp">WebP</div>
              <div class="rz-format-tab" data-format="image/png">PNG</div>
            </div>
            <div class="rz-control-row" id="rz-quality-row">
              <label>质量</label>
              <input type="range" id="rz-quality-slider" min="5" max="100" value="85" />
              <input type="number" id="rz-quality-input" min="5" max="100" value="85" />
            </div>
            <div class="rz-output-stats">
              <div class="rz-stat">
                <span class="rz-key">预估输出大小</span>
                <span class="rz-val" id="rz-estimated-size">—</span>
              </div>
              <div class="rz-stat">
                <span class="rz-key">相比原始</span>
                <span class="rz-val" id="rz-compare-text">—</span>
              </div>
            </div>
            <div class="rz-size-bar">
              <div class="rz-size-bar-fill" id="rz-size-bar-fill" style="width:0%"></div>
            </div>
          </div>

          <button class="rz-btn rz-btn-primary" id="rz-download-btn" disabled>下载调整后图片</button>
          <button class="rz-btn rz-btn-secondary" id="rz-reset-btn" style="display:none">重新选择图片</button>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js?v=11"></script>

    <!-- PIXEL SCALE inline JS -->
    <script>
    (function () {
      "use strict";
      const z = function (id) { return document.getElementById(id); };
      const uploadZone = z("rz-upload-zone");
      const fileInput  = z("rz-file-input");
      const previewArea = z("rz-preview-area");
      const previewImg  = z("rz-preview-img");
      const infoRow     = z("rz-info-row");
      const originalSize = z("rz-original-size");
      const originalDims = z("rz-original-dims");
      const controlsCard = z("rz-controls-card");
      const qualityRow   = z("rz-quality-row");
      const qualitySlider = z("rz-quality-slider");
      const qualityInput  = z("rz-quality-input");
      const estimatedSize = z("rz-estimated-size");
      const compareText   = z("rz-compare-text");
      const sizeBarFill   = z("rz-size-bar-fill");
      const downloadBtn   = z("rz-download-btn");
      const resetBtn      = z("rz-reset-btn");
      const formatTabs    = document.querySelectorAll(".rz-format-tab");

      let imageObj = null, originalBytes = 0, outputFormat = "image/jpeg";

      formatTabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          formatTabs.forEach(function (t) { t.classList.remove("rz-active"); });
          tab.classList.add("rz-active");
          outputFormat = tab.dataset.format;
          qualityRow.style.display = outputFormat === "image/png" ? "none" : "";
          updateEstimate();
        });
      });

      qualitySlider.addEventListener("input", function () {
        qualityInput.value = qualitySlider.value;
        updateEstimate();
      });
      qualityInput.addEventListener("input", function () {
        var v = Math.min(100, Math.max(5, Number(qualityInput.value) || 85));
        qualityInput.value = String(v);
        qualitySlider.value = String(v);
        updateEstimate();
      });

      function updateEstimate() {
        if (!imageObj) return;
        var q = outputFormat === "image/png" ? 100 : Number(qualityInput.value) || 85;
        var w = imageObj.naturalWidth, h = imageObj.naturalHeight;
        var canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(imageObj, 0, 0);
        canvas.toBlob(function (blob) {
          if (!blob) return;
          estimatedSize.textContent = formatBytes(blob.size);
          var ratio = originalBytes ? Math.round((blob.size / originalBytes) * 100) : 100;
          var diff = originalBytes ? originalBytes - blob.size : 0;
          var diffText = diff >= 0
            ? "−" + formatBytes(diff) + "（" + (100 - ratio) + "%）"
            : "+" + formatBytes(-diff) + "（" + (ratio - 100) + "%）";
          compareText.textContent = diffText;
          compareText.className = "rz-val";
          if (diff > 0) compareText.classList.add("rz-save");
          else if (diff === 0) compareText.classList.add("rz-warn");
          else compareText.classList.add("rz-large");
          sizeBarFill.style.width = Math.min(100, ratio) + "%";
          sizeBarFill.style.background = ratio <= 60 ? "#34c759" : ratio <= 90 ? "var(--blue)" : "#ff3b30";
        }, outputFormat, q / 100);
      }

      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function loadImage(file) {
        originalBytes = file.size;
        originalSize.textContent = formatBytes(file.size);
        var reader = new FileReader();
        reader.onload = function (e) {
          var img = new Image();
          img.onload = function () {
            imageObj = img;
            originalDims.textContent = img.naturalWidth + " × " + img.naturalHeight;
            previewImg.src = e.target.result;
            previewArea.classList.add("rz-visible");
            infoRow.classList.add("rz-visible");
            uploadZone.classList.add("rz-has-image");
            controlsCard.style.display = "";
            resetBtn.style.display = "";
            downloadBtn.disabled = false;
            if (outputFormat === "image/png") qualityRow.style.display = "none";
            updateEstimate();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function resetAll() {
        imageObj = null; originalBytes = 0;
        previewImg.src = "";
        previewArea.classList.remove("rz-visible");
        infoRow.classList.remove("rz-visible");
        uploadZone.classList.remove("rz-has-image");
        controlsCard.style.display = "none";
        resetBtn.style.display = "none";
        downloadBtn.disabled = true;
        estimatedSize.textContent = "—";
        compareText.textContent = "—";
        compareText.className = "rz-val";
        sizeBarFill.style.width = "0%";
        fileInput.value = "";
        outputFormat = "image/jpeg";
        qualityRow.style.display = "";
        qualitySlider.value = "85";
        qualityInput.value = "85";
        formatTabs.forEach(function (t) { t.classList.remove("rz-active"); });
        document.querySelector('[data-format="image/jpeg"]').classList.add("rz-active");
      }

      uploadZone.addEventListener("click", function () { fileInput.click(); });
      uploadZone.addEventListener("dragover", function (e) { e.preventDefault(); uploadZone.classList.add("rz-drag-over"); });
      uploadZone.addEventListener("dragleave", function () { uploadZone.classList.remove("rz-drag-over"); });
      uploadZone.addEventListener("drop", function (e) {
        e.preventDefault(); uploadZone.classList.remove("rz-drag-over");
        var file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) loadImage(file);
      });
      fileInput.addEventListener("change", function () {
        var file = fileInput.files[0];
        if (file) loadImage(file);
      });

      downloadBtn.addEventListener("click", function () {
        if (!imageObj) return;
        var q = outputFormat === "image/png" ? 100 : Number(qualityInput.value) || 85;
        var canvas = document.createElement("canvas");
        canvas.width = imageObj.naturalWidth; canvas.height = imageObj.naturalHeight;
        var ctx = canvas.getContext("2d");
        ctx.drawImage(imageObj, 0, 0);
        canvas.toBlob(function (blob) {
          var ext = outputFormat === "image/jpeg" ? "jpg" : outputFormat === "image/webp" ? "webp" : "png";
          var url = URL.createObjectURL(blob);
          var a = document.createElement("a");
          a.href = url; a.download = "pixel-scale." + ext;
          document.body.append(a); a.click();
          setTimeout(function () { a.remove(); URL.revokeObjectURL(url); }, 120);
        }, outputFormat, q / 100);
      });

      resetBtn.addEventListener("click", resetAll);
    })();
    </script>

    <!-- Tab switching -->
    <script>
    (function () {
      var tabs = document.querySelectorAll(".tab");
      var contents = document.querySelectorAll(".tab-content");
      tabs.forEach(function (tab) {
        tab.addEventListener("click", function () {
          var target = tab.dataset.tab;
          tabs.forEach(function (t) { t.classList.remove("active"); });
          tab.classList.add("active");
          contents.forEach(function (c) {
            c.style.display = c.id === "tab-" + target ? "" : "none";
          });
        });
      });
    })();
    </script>
  </body>
</html>
