<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="上传图片 · 无损转换格式 · 精准控制文件大小" />
  <title>PIXEL SCALE · 图片大小调节</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #ffffff;
      --surface: #f2f2f7;
      --card: rgba(255,255,255,0.92);
      --text: #1d1d1f;
      --muted: #86868b;
      --line: rgba(0,0,0,0.08);
      --blue: #0071e3;
      --blue-bg: rgba(0,113,227,0.08);
      --green: #34c759;
      --orange: #ff9f0a;
      --red: #ff3b30;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --surface: #1c1c1e;
        --card: rgba(28,28,30,0.92);
        --text: #f5f5f7;
        --muted: #98989d;
        --line: rgba(255,255,255,0.1);
        --blue: #0a84ff;
        --blue-bg: rgba(10,132,255,0.1);
      }
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
    header { text-align: center; padding: 32px 0 20px; }
    header h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 6px; }
    header p { font-size: 15px; color: var(--muted); font-weight: 400; }

    .upload-zone {
      border: 2px dashed var(--line); border-radius: 20px;
      padding: 48px 24px; text-align: center; cursor: pointer;
      transition: border-color 0.2s, background 0.2s; margin-bottom: 20px;
    }
    .upload-zone:hover, .upload-zone.drag-over { border-color: var(--blue); background: var(--blue-bg); }
    .upload-zone.has-image { border-style: solid; padding: 24px; }
    .upload-icon { font-size: 40px; margin-bottom: 12px; opacity: 0.4; }
    .upload-zone.has-image .upload-icon, .upload-zone.has-image .upload-label,
    .upload-zone.has-image .upload-hint { display: none; }
    .upload-label { font-size: 16px; font-weight: 500; }
    .upload-hint { font-size: 13px; color: var(--muted); margin-top: 4px; }

    .preview-area { display: none; border-radius: 18px; overflow: hidden; background: var(--surface); margin-bottom: 20px; }
    .preview-area.visible { display: block; }
    .preview-area img { width: 100%; height: auto; display: block; }

    .info-row { display: none; gap: 12px; margin-bottom: 20px; }
    .info-row.visible { display: flex; }
    .info-chip {
      flex: 1; background: var(--surface); border-radius: 14px; padding: 14px 16px;
    }
    .info-chip .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
    .info-chip .value { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }

    .card { background: var(--surface); border-radius: 18px; padding: 20px; margin-bottom: 16px; }
    .card-header { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .row { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
    .row:last-child { margin-bottom: 0; }
    .row label { font-size: 14px; font-weight: 500; min-width: 56px; white-space: nowrap; }

    .row input[type="range"] {
      flex: 1; -webkit-appearance: none; height: 6px; border-radius: 3px; background: var(--line); outline: none;
    }
    .row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; border: 2px solid var(--line); box-shadow: 0 2px 8px rgba(0,0,0,0.12); cursor: pointer;
    }
    .row input[type="number"] {
      width: 72px; padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 10px;
      font-size: 14px; font-weight: 500; text-align: center; background: var(--bg); color: var(--text);
      outline: none; font-family: inherit; -moz-appearance: textfield;
    }
    .row input[type="number"]::-webkit-outer-spin-button, .row input[type="number"]::-webkit-inner-spin-button {
      -webkit-appearance: none; margin: 0;
    }
    .row input[type="number"]:focus { border-color: var(--blue); }

    .format-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .format-tab {
      flex: 1; padding: 10px 0; text-align: center; font-size: 14px; font-weight: 500;
      border-radius: 12px; background: var(--bg); border: 1.5px solid var(--line);
      cursor: pointer; transition: all 0.15s; color: var(--text);
      -webkit-tap-highlight-color: transparent;
    }
    .format-tab.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .output-stats { margin-top: 14px; }
    .stat { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; }
    .stat .key { font-size: 14px; color: var(--muted); }
    .stat .val { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .stat .val.save { color: var(--green); }
    .stat .val.warn { color: var(--orange); }
    .stat .val.large { color: var(--red); }

    .size-bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 10px; overflow: hidden; }
    .size-bar-fill { height: 100%; border-radius: 3px; background: var(--blue); transition: width 0.3s, background 0.3s; }

    .btn {
      display: block; width: 100%; padding: 16px; font-size: 17px; font-weight: 600;
      border: none; border-radius: 16px; cursor: pointer; transition: opacity 0.15s;
      font-family: inherit; -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: 0.8; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--line); margin-top: 10px; }
    .btn:disabled { opacity: 0.35; pointer-events: none; }

    input[type="file"] { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>PIXEL SCALE</h1>
      <p>上传图片 · 无损尺寸 · 格式与质量调节文件大小</p>
    </header>

    <div class="upload-zone" id="upload-zone">
      <div class="upload-icon">⬆</div>
      <div class="upload-label">点击或拖入图片</div>
      <div class="upload-hint">支持 JPG · PNG · WebP · HEIC</div>
    </div>
    <input type="file" id="file-input" accept="image/*" />

    <div class="preview-area" id="preview-area">
      <img id="preview-img" alt="预览" />
    </div>

    <div class="info-row" id="info-row">
      <div class="info-chip">
        <div class="label">原始大小</div>
        <div class="value" id="original-size">—</div>
      </div>
      <div class="info-chip">
        <div class="label">原始尺寸</div>
        <div class="value" id="original-dims">—</div>
      </div>
    </div>

    <div class="card" style="display:none" id="controls-card">
      <div class="card-header">输出格式</div>
      <div class="format-tabs">
        <div class="format-tab active" data-format="image/jpeg">JPEG</div>
        <div class="format-tab" data-format="image/webp">WebP</div>
        <div class="format-tab" data-format="image/png">PNG</div>
      </div>
      <div class="row" id="quality-row">
        <label>质量</label>
        <input type="range" id="quality-slider" min="5" max="100" value="85" />
        <input type="number" id="quality-input" min="5" max="100" value="85" />
      </div>
      <div class="output-stats">
        <div class="stat">
          <span class="key">预估输出大小</span>
          <span class="val" id="estimated-size">—</span>
        </div>
        <div class="stat">
          <span class="key">相比原始</span>
          <span class="val" id="compare-text">—</span>
        </div>
      </div>
      <div class="size-bar">
        <div class="size-bar-fill" id="size-bar-fill" style="width:0%"></div>
      </div>
    </div>

    <button class="btn btn-primary" id="download-btn" disabled>下载调整后图片</button>
    <button class="btn btn-secondary" id="reset-btn" style="display:none">重新选择图片</button>
  </div>

  <script>
    (function () {
      const uploadZone = document.getElementById("upload-zone");
      const fileInput = document.getElementById("file-input");
      const previewArea = document.getElementById("preview-area");
      const previewImg = document.getElementById("preview-img");
      const infoRow = document.getElementById("info-row");
      const originalSize = document.getElementById("original-size");
      const originalDims = document.getElementById("original-dims");
      const controlsCard = document.getElementById("controls-card");
      const qualityRow = document.getElementById("quality-row");
      const qualitySlider = document.getElementById("quality-slider");
      const qualityInput = document.getElementById("quality-input");
      const estimatedSize = document.getElementById("estimated-size");
      const compareText = document.getElementById("compare-text");
      const sizeBarFill = document.getElementById("size-bar-fill");
      const downloadBtn = document.getElementById("download-btn");
      const resetBtn = document.getElementById("reset-btn");
      const formatTabs = document.querySelectorAll(".format-tab");

      let imageObj = null;
      let originalBytes = 0;
      let outputFormat = "image/jpeg";

      // Format tabs
      formatTabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          formatTabs.forEach((t) => t.classList.remove("active"));
          tab.classList.add("active");
          outputFormat = tab.dataset.format;
          if (outputFormat === "image/png") {
            qualityRow.style.display = "none";
          } else {
            qualityRow.style.display = "";
          }
          updateEstimate();
        });
      });

      // Quality
      qualitySlider.addEventListener("input", () => {
        qualityInput.value = qualitySlider.value;
        updateEstimate();
      });
      qualityInput.addEventListener("input", () => {
        const v = Math.min(100, Math.max(5, Number(qualityInput.value) || 85));
        qualityInput.value = String(v);
        qualitySlider.value = String(v);
        updateEstimate();
      });

      async function updateEstimate() {
        if (!imageObj) return;
        const q = outputFormat === "image/png" ? 100 : Number(qualityInput.value) || 85;
        const w = imageObj.naturalWidth;
        const h = imageObj.naturalHeight;

        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imageObj, 0, 0);

        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, outputFormat, q / 100);
        });

        if (blob) {
          estimatedSize.textContent = formatBytes(blob.size);
          const ratio = originalBytes ? Math.round((blob.size / originalBytes) * 100) : 100;
          const diff = originalBytes ? originalBytes - blob.size : 0;
          const diffText = diff >= 0
            ? `−${formatBytes(diff)}（${100 - ratio}%）`
            : `+${formatBytes(-diff)}（${ratio - 100}%）`;

          compareText.textContent = diffText;
          compareText.className = "val";
          if (diff > 0) compareText.classList.add("save");
          else if (diff === 0) compareText.classList.add("warn");
          else compareText.classList.add("large");

          sizeBarFill.style.width = `${Math.min(100, ratio)}%`;
          sizeBarFill.style.background = ratio <= 60 ? "var(--green)" : ratio <= 90 ? "var(--blue)" : "var(--red)";
        }
      }

      function formatBytes(bytes) {
        if (bytes === 0) return "0 B";
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(1) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function loadImage(file) {
        originalBytes = file.size;
        originalSize.textContent = formatBytes(file.size);

        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            imageObj = img;
            originalDims.textContent = `${img.naturalWidth} × ${img.naturalHeight}`;
            previewImg.src = e.target.result;
            previewArea.classList.add("visible");
            infoRow.classList.add("visible");
            uploadZone.classList.add("has-image");
            controlsCard.style.display = "";
            resetBtn.style.display = "";
            downloadBtn.disabled = false;
            if (outputFormat === "image/png") qualityRow.style.display = "none";
            updateEstimate();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }

      function resetAll() {
        imageObj = null;
        originalBytes = 0;
        previewImg.src = "";
        previewArea.classList.remove("visible");
        infoRow.classList.remove("visible");
        uploadZone.classList.remove("has-image");
        controlsCard.style.display = "none";
        resetBtn.style.display = "none";
        downloadBtn.disabled = true;
        estimatedSize.textContent = "—";
        compareText.textContent = "—";
        compareText.className = "val";
        sizeBarFill.style.width = "0%";
        fileInput.value = "";
        outputFormat = "image/jpeg";
        qualityRow.style.display = "";
        qualitySlider.value = "85";
        qualityInput.value = "85";
        formatTabs.forEach((t) => t.classList.remove("active"));
        document.querySelector('[data-format="image/jpeg"]').classList.add("active");
      }

      // Upload
      uploadZone.addEventListener("click", () => fileInput.click());
      uploadZone.addEventListener("dragover", (e) => { e.preventDefault(); uploadZone.classList.add("drag-over"); });
      uploadZone.addEventListener("dragleave", () => uploadZone.classList.remove("drag-over"));
      uploadZone.addEventListener("drop", (e) => {
        e.preventDefault(); uploadZone.classList.remove("drag-over");
        const file = e.dataTransfer.files[0];
        if (file && file.type.startsWith("image/")) loadImage(file);
      });
      fileInput.addEventListener("change", () => {
        const file = fileInput.files[0];
        if (file) loadImage(file);
      });

      // Download
      downloadBtn.addEventListener("click", async () => {
        if (!imageObj) return;
        const q = outputFormat === "image/png" ? 100 : Number(qualityInput.value) || 85;
        const w = imageObj.naturalWidth;
        const h = imageObj.naturalHeight;

        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(imageObj, 0, 0);

        const blob = await new Promise((resolve) => {
          canvas.toBlob(resolve, outputFormat, q / 100);
        });

        const ext = outputFormat === "image/jpeg" ? "jpg" : outputFormat === "image/webp" ? "webp" : "png";
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = `pixel-scale.${ext}`;
        document.body.append(a); a.click();
        setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 120);
      });

      resetBtn.addEventListener("click", resetAll);
    })();
  </script>
</body>
</html>
